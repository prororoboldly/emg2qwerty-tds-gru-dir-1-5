# @package _global_
# Transform config for 4-channel experiment (first 4 of 16 electrodes per band).
# Use with: module.num_electrode_channels=4 module.in_features=132
to_tensor:
  _target_: emg2qwerty.transforms.ToTensor
  fields: [emg_left, emg_right]

band_rotation:
  _target_: emg2qwerty.transforms.ForEach
  transform:
    _target_: emg2qwerty.transforms.RandomBandRotation
    offsets: [-1, 0, 1]

temporal_jitter:
  _target_: emg2qwerty.transforms.TemporalAlignmentJitter
  max_offset: 120

logspec:
  _target_: emg2qwerty.transforms.LogSpectrogram
  n_fft: 64
  hop_length: 16

channel_subset:
  _target_: emg2qwerty.transforms.ChannelSubset
  num_channels: 14

specaug:
  _target_: emg2qwerty.transforms.SpecAugment
  n_time_masks: 3
  time_mask_param: 25
  n_freq_masks: 2
  freq_mask_param: 4

transforms:
  train:
    - ${to_tensor}
    - ${band_rotation}
    - ${temporal_jitter}
    - ${logspec}
    - ${channel_subset}
    - ${specaug}
  val:
    - ${to_tensor}
    - ${logspec}
    - ${channel_subset}
  test: ${transforms.val}
