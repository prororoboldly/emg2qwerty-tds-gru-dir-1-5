# @package _global_
# Transform config for 250 Hz effective sampling rate (downsample by 8 from 2kHz).
# No model config changes needed (in_features stays 528).
to_tensor:
  _target_: emg2qwerty.transforms.ToTensor
  fields: [emg_left, emg_right]

band_rotation:
  _target_: emg2qwerty.transforms.ForEach
  transform:
    _target_: emg2qwerty.transforms.RandomBandRotation
    offsets: [-1, 0, 1]

temporal_jitter:
  _target_: emg2qwerty.transforms.TemporalAlignmentJitter
  max_offset: 120

downsample:
  _target_: emg2qwerty.transforms.Downsample
  factor: 3  # 2000 Hz / 2.667 = 750 Hz

logspec:
  _target_: emg2qwerty.transforms.LogSpectrogram
  n_fft: 64
  hop_length: 16

specaug:
  _target_: emg2qwerty.transforms.SpecAugment
  n_time_masks: 3
  time_mask_param: 25
  n_freq_masks: 2
  freq_mask_param: 4

transforms:
  train:
    - ${to_tensor}
    - ${band_rotation}
    - ${temporal_jitter}
    - ${downsample}
    - ${logspec}
    - ${specaug}
  val:
    - ${to_tensor}
    - ${downsample}
    - ${logspec}
  test: ${transforms.val}
